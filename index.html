<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منظومة الاستعلام عن الطلبة المستنفدين - كلية الطب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blue: #2E5C9E;
    --blue-2: #3B6DB6;
    --blue-3: #4A80CB;
    --blue-dark: #1E3F70;
    --blue-deep: #12294A;
    --gold: #D4A24A;
    --gold-light: #F0D9A0;
    --orange: #E87A2C;
    --orange-dark: #C9661F;
    --orange-light: #FDF2E9;
    --green: #1A7F5E;
    --bg: #EEF2F7;
    --text: #1a202c;
    --gray: #64748B;
    --line: #E2E8F0;
    --shadow-sm: 0 2px 8px rgba(18,41,74,.06);
    --shadow-md: 0 8px 24px rgba(18,41,74,.10);
    --shadow-lg: 0 18px 50px rgba(18,41,74,.15);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Cairo', 'Tajawal', sans-serif;
    background:
      radial-gradient(circle at 0% 0%, rgba(59,109,182,.10) 0, transparent 40%),
      radial-gradient(circle at 100% 100%, rgba(212,162,74,.08) 0, transparent 40%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 16px 60px;
    line-height: 1.7;
  }

  /* ===== HEADER ===== */
  .header{
    width: 100%;
    max-width: 1100px;
    background: linear-gradient(135deg, var(--blue-deep) 0%, var(--blue-dark) 45%, var(--blue) 100%);
    color: #fff;
    border-radius: 0 0 28px 28px;
    padding: 42px 30px 100px;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow-lg);
    text-align: center;
  }
  .header::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      radial-gradient(circle at 15% 25%, rgba(255,255,255,.10) 0, transparent 35%),
      radial-gradient(circle at 85% 75%, rgba(212,162,74,.15) 0, transparent 40%);
    pointer-events:none;
  }
  .header::after{
    content:"";
    position:absolute; bottom:-1px; left:0; right:0;
    height: 60px;
    background: var(--bg);
    clip-path: polygon(0 100%, 0 40%, 8% 50%, 16% 30%, 24% 55%, 32% 25%, 40% 48%, 48% 20%, 56% 45%, 64% 22%, 72% 50%, 80% 28%, 88% 52%, 96% 30%, 100% 45%, 100% 100%);
    opacity: .9;
  }
  .header-inner{position: relative;z-index: 2}
  .uni-crest{
    width: 78px;height: 78px;margin: 0 auto 16px;border-radius: 50%;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
    display: flex;align-items: center;justify-content: center;font-size: 38px;
    box-shadow: 0 8px 24px rgba(212,162,74,.45), inset 0 -3px 8px rgba(0,0,0,.10);
    border: 3px solid rgba(255,255,255,.35);
  }
  .header h1{font-size: 1.85rem;font-weight: 800;letter-spacing: .3px;margin-bottom: 4px;text-shadow: 0 2px 12px rgba(0,0,0,.2)}
  .header h2{font-size: 1.25rem;font-weight: 600;color: var(--gold-light);margin-bottom: 24px;letter-spacing: 1px}
  .header .divider{width: 120px;height: 3px;margin: 0 auto 20px;background: linear-gradient(90deg, transparent, var(--gold), transparent);border-radius: 3px}
  .header h3{font-size: 1.35rem;font-weight: 700;line-height: 1.5;max-width: 780px;margin: 0 auto;text-shadow: 0 2px 8px rgba(0,0,0,.15)}

  /* ===== SEARCH ===== */
  .search-section{
    width: 100%;max-width: 900px;margin-top: -60px;position: relative;z-index: 5;
    background: #fff;border-radius: 22px;padding: 30px 28px 26px;
    box-shadow: var(--shadow-lg);border: 1px solid rgba(226,232,240,.8);
  }
  .search-label{display: flex;align-items: center;gap: 10px;font-size: 1.15rem;font-weight: 700;color: var(--blue-dark);margin-bottom: 14px}
  .search-label .icon{
    width: 38px;height: 38px;border-radius: 10px;
    background: linear-gradient(135deg, var(--blue-2), var(--blue-3));
    color: #fff;display: flex;align-items: center;justify-content: center;font-size: 1.15rem;
    box-shadow: 0 4px 10px rgba(59,109,182,.35);
  }
  .search-input-wrap{position: relative}
  .search-input{
    width: 100%;background: linear-gradient(135deg, #f7f9fc 0%, #eef3fa 100%);
    color: var(--blue-deep);border: 2px solid var(--line);border-radius: 14px;
    padding: 18px 55px 18px 22px;font-size: 1.15rem;
    font-family: 'Cairo', sans-serif;font-weight: 600;text-align: right;outline: none;
    transition: all .25s ease;
  }
  .search-input::placeholder{color: #94A3B8;font-weight: 500}
  .search-input:focus{
    background: #fff;border-color: var(--blue-2);
    box-shadow: 0 0 0 5px rgba(59,109,182,.15), 0 6px 18px rgba(59,109,182,.12);
    transform: translateY(-1px);
  }
  .search-input-wrap .search-ico{
    position: absolute;top: 50%;right: 20px;transform: translateY(-50%);
    font-size: 1.3rem;color: var(--blue-2);pointer-events: none;opacity: .8;
  }
  .search-hint{margin-top: 12px;font-size: .85rem;color: var(--gray);text-align: center}
  .search-hint b{color: var(--blue-dark)}

  /* ===== RESULTS ===== */
  .results-container{
    width: 100%;max-width: 900px;margin-top: 34px;
    display: flex;flex-direction: column;gap: 26px;
  }

  /* ===== STUDENT CARD ===== */
  .student-card{
    background: #fff;border-radius: 20px;padding: 0;
    box-shadow: var(--shadow-md);border: 1px solid var(--line);
    overflow: hidden;
    animation: cardIn .45s cubic-bezier(.2,.7,.3,1) both;
    transition: transform .25s ease, box-shadow .25s ease;
    position: relative;
  }
  .student-card:hover{transform: translateY(-3px);box-shadow: var(--shadow-lg)}
  @keyframes cardIn{
    from { opacity: 0; transform: translateY(14px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .card-bar{
    background: linear-gradient(135deg, var(--blue-dark) 0%, var(--blue-2) 100%);
    color: #fff;padding: 14px 22px;
    display: flex;align-items: center;justify-content: space-between;
    gap: 12px;position: relative;overflow: hidden;
  }
  .card-bar::before{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent);
    transform: translateX(-100%);
    animation: shine 3s ease-in-out infinite;
  }
  @keyframes shine{0%,100%{transform: translateX(-100%)}50%{transform: translateX(100%)}}
  .card-bar-title{
    display: flex;align-items: center;gap: 10px;font-weight: 700;font-size: 1rem;
    position: relative;z-index: 2;
  }
  .card-bar-title .badge{
    background: rgba(255,255,255,.18);padding: 3px 11px;border-radius: 20px;
    font-size: .82rem;font-weight: 700;border: 1px solid rgba(255,255,255,.25);
  }
  .print-btn{
    position: relative;z-index: 2;
    background: rgba(255,255,255,.15);color: #fff;
    border: 1.5px solid rgba(255,255,255,.35);
    padding: 8px 16px;border-radius: 10px;
    font-family: 'Cairo', sans-serif;font-size: .88rem;font-weight: 700;
    cursor: pointer;display: inline-flex;align-items: center;gap: 7px;
    transition: all .2s ease;backdrop-filter: blur(6px);
  }
  .print-btn:hover{
    background: var(--gold);border-color: var(--gold);color: var(--blue-deep);
    transform: translateY(-1px);box-shadow: 0 6px 16px rgba(212,162,74,.4);
  }
  .print-btn:active{transform: translateY(0)}
  .print-btn svg{width:15px;height:15px}

  .card-body{padding: 26px 26px 30px}
  .card-row{display: flex;align-items: center;gap: 18px;margin-bottom: 14px}
  .card-row:last-child{margin-bottom: 0}
  .card-label{
    font-size: 1.05rem;font-weight: 700;color: var(--blue-deep);
    width: 340px;text-align: right;flex-shrink: 0;
    position: relative;padding-right: 14px;
  }
  .card-label::before{
    content:"";
    position: absolute;right: 0;top: 50%;transform: translateY(-50%);
    width: 5px;height: 60%;
    background: linear-gradient(180deg, var(--gold), var(--gold-light));
    border-radius: 4px;
  }
  .card-value-box{
    flex: 1;padding: 13px 22px;border-radius: 12px;
    font-size: 1.08rem;font-weight: 700;text-align: center;
    display: flex;align-items: center;justify-content: center;
    min-height: 52px;transition: transform .15s ease;
  }
  .card-value-box:hover{transform: scale(1.01)}
  .box-blue{
    background: linear-gradient(135deg, var(--blue) 0%, var(--blue-2) 100%);
    color: #fff;
    box-shadow: 0 4px 12px rgba(46,92,158,.25), inset 0 -2px 4px rgba(0,0,0,.08);
    letter-spacing: .3px;
  }
  .box-orange{
    background: linear-gradient(135deg, #FFF 0%, var(--orange-light) 100%);
    color: var(--orange-dark);border: 2.5px solid var(--orange);
    box-shadow: 0 4px 12px rgba(232,122,44,.15), inset 0 0 0 1px rgba(232,122,44,.08);
    font-weight: 800;letter-spacing: .5px;
  }
  .box-orange.yes{background: linear-gradient(135deg, #FFF5EB 0%, #FCE3CB 100%);color: #A8531A}
  .box-orange.no{
    background: linear-gradient(135deg, #F0FDF7 0%, #DCF3E9 100%);
    color: var(--green);border-color: var(--green);
    box-shadow: 0 4px 12px rgba(26,127,94,.15);
  }

  /* ===== EMPTY ===== */
  .empty-state{
    text-align: center;padding: 60px 30px;background: #fff;border-radius: 20px;
    border: 1.5px dashed #CBD5E0;color: var(--gray);font-size: 1.05rem;
    box-shadow: var(--shadow-sm);
  }
  .empty-state .big-icon{font-size: 3rem;margin-bottom: 14px;opacity: .55;display: block}
  .empty-state .title{font-size: 1.2rem;font-weight: 700;color: var(--blue-dark);margin-bottom: 8px;display: block}
  .empty-state b{color: var(--orange-dark)}

  /* ===== FOOTER ===== */
  .footer{
    width: 100%;max-width: 900px;margin-top: 50px;text-align: center;
    color: var(--gray);font-size: .85rem;line-height: 1.9;padding: 22px 16px;
    border-top: 1px solid var(--line);
  }
  .footer b{color: var(--blue-dark);font-weight: 700}

  /* ===== PRINT HEADER (hidden on screen) ===== */
  .print-header{display: none}

  /* ===== PRINT AREA (hidden on screen) ===== */
  .print-area{display: none}

  /* ===== PRINT STYLES ===== */
  @media print{
    @page{ size: A4; margin: 15mm 12mm; }

    body{
      background: #fff !important;
      padding: 0 !important;
      display: block !important;
      margin: 0 !important;
    }

    /* إخفاء كل شيء في الصفحة ما عدا حاوية الطباعة */
    body > *:not(.print-area){ display: none !important; }

    /* إظهار حاوية الطباعة فقط */
    .print-area{
      display: block !important;
      padding: 0;
      margin: 0;
      width: 100%;
    }

    /* ترويسة الطباعة الرسمية */
    .print-area .print-header{
      display: block !important;
      text-align: center;
      margin-bottom: 22px;
      padding-bottom: 16px;
      border-bottom: 3px double #2E5C9E;
    }
    .print-area .print-header h1{
      font-size: 1.4rem;color: #12294A;margin-bottom: 6px;font-weight: 800;
    }
    .print-area .print-header h2{
      font-size: 1rem;color: #444;font-weight: 600;margin-bottom: 8px;
    }
    .print-area .print-header .stamp{
      margin-top: 10px;font-size: .85rem;color: #666;
      padding-top: 8px;border-top: 1px dashed #ccc;
    }

    /* البطاقة المطبوعة */
    .print-area .student-card{
      display: block !important;
      box-shadow: none !important;
      border: 2px solid #2E5C9E !important;
      border-radius: 12px !important;
      transform: none !important;
      break-inside: avoid !important;
      page-break-inside: avoid !important;
      margin: 0 !important;
      overflow: hidden !important;
      animation: none !important;
    }
    .print-area .student-card:hover{ transform: none !important; }

    /* شريط البطاقة */
    .print-area .card-bar{
      background: #2E5C9E !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      padding: 12px 20px !important;
    }
    .print-area .card-bar::before{ display: none !important; }

    /* إخفاء زر الطباعة داخل النسخة المطبوعة */
    .print-area .print-btn{ display: none !important; }

    /* الحقول الزرقاء */
    .print-area .box-blue{
      background: #2E5C9E !important;
      color: #fff !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* الحقول البرتقالية */
    .print-area .box-orange{
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .print-area .card-value-box:hover{ transform: none !important; }

    /* ضبط هوامش البطاقة */
    .print-area .card-body{ padding: 22px 24px 26px !important; }
    .print-area .card-row{ margin-bottom: 12px !important; }
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 768px){
    .header{padding: 34px 20px 90px;border-radius: 0 0 22px 22px}
    .header h1{font-size: 1.4rem}
    .header h2{font-size: 1rem}
    .header h3{font-size: 1.05rem}
    .uni-crest{width: 64px;height: 64px;font-size: 30px}
    .search-section{padding: 22px 18px 20px;margin-top: -50px}
    .search-input{font-size: 1rem;padding: 15px 48px 15px 18px}
    .search-label{font-size: 1rem}
    .card-row{flex-direction: column;align-items: stretch;gap: 7px}
    .card-label{width: 100%;font-size: .98rem;padding-right: 12px}
    .card-value-box{font-size: 1rem;padding: 11px 16px}
    .card-body{padding: 20px 18px 22px}
    .card-bar{padding: 12px 16px}
    .card-bar-title{font-size: .9rem}
    .print-btn{padding: 7px 12px;font-size: .8rem}
  }
  @media (max-width: 420px){
    .header h3{font-size: .95rem}
    .print-btn span{display: none}
    .print-btn{padding: 8px 10px}
  }
</style>
</head>

/* =========================================================
   2) تجميع البيانات
   ========================================================= */
const STUDENTS = new Map();

SECTIONS.forEach(sec => {
  sec.data.trim().split('\n').forEach(line => {
    line = line.trim();
    if(!line) return;
    const parts = line.split('|');
    if(parts.length < 3) return;
    const id = parts[0].trim();
    const name = parts[1].trim();
    const chances = parseInt(parts[2], 10) || 0;

    if(!STUDENTS.has(id)){
      STUDENTS.set(id, { id, name, records: [] });
    }
    const st = STUDENTS.get(id);
    if(name.length > st.name.length) st.name = name;
    st.records.push({ year: sec.year, chances, dec: sec.dec });
  });
});

STUDENTS.forEach(st => st.records.sort((a,b) => a.year - b.year));
const ALL = Array.from(STUDENTS.values());

/* =========================================================
   3) أدوات البحث
   ========================================================= */
const DIACRITICS = /[\u064B-\u0652\u0640\u0670]/g;
function simpleNorm(s){
  return String(s)
    .replace(DIACRITICS, '')
    .replace(/[أإآٱ]/g, 'ا')
    .replace(/ى/g, 'ي')
    .replace(/ئ/g, 'ي')
    .replace(/ؤ/g, 'و')
    .replace(/ة/g, 'ه')
    .replace(/\s+/g, ' ')
    .trim();
}
function getYearName(y){
  if(y === 1) return 'الأولى';
  if(y === 2) return 'الثانية';
  if(y === 3) return 'الثالثة';
  return y;
}

/* =========================================================
   4) العرض
   ========================================================= */
const $searchInput = document.getElementById('searchInput');
const $resultsContainer = document.getElementById('resultsContainer');
const $printArea = document.getElementById('printArea');

function searchStudents(q){
  q = q.trim();
  if(!q) return [];
  const nq = simpleNorm(q);
  const isNum = /^\d+$/.test(q);
  return ALL.filter(st => {
    if(isNum && st.id.includes(q)) return true;
    if(nq && simpleNorm(st.name).includes(nq)) return true;
    if(!isNum && st.id.includes(q)) return true;
    return false;
  });
}

function renderCard(student, record, forPrint = false){
  const isIssued = record.dec === 1;
  const issuedVal = isIssued ? 'نعم' : 'لا';
  const notIssuedVal = isIssued ? 'لا' : 'نعم';
  const issuedClass = isIssued ? 'yes' : 'no';
  const notIssuedClass = isIssued ? 'no' : 'yes';

  return `
    <div class="student-card" data-id="${student.id}" data-year="${record.year}">
      <div class="card-bar">
        <div class="card-bar-title">
          <span>📋 بطاقة استعلام</span>
          <span class="badge">السنة ${getYearName(record.year)}</span>
        </div>
        ${forPrint ? '' : `
          <button class="print-btn" type="button" onclick="printStudentCard(this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 6 2 18 2 18 9"></polyline>
              <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
              <rect x="6" y="14" width="12" height="8"></rect>
            </svg>
            <span>طباعة</span>
          </button>
        `}
      </div>
      <div class="card-body">
        <div class="print-header">
          <h1>جامعة بنغازي — كلية الطب</h1>
          <h2>منظومة الاستعلام عن الطلبة المستنفدين للفرص الدراسية</h2>
          <div class="stamp"></div>
        </div>
        <div class="card-row">
          <div class="card-label">اسم الطالب:</div>
          <div class="card-value-box box-blue">${student.name}</div>
        </div>
        <div class="card-row">
          <div class="card-label">الرقم الدراسي:</div>
          <div class="card-value-box box-blue">${student.id}</div>
        </div>
        <div class="card-row">
          <div class="card-label">السنة الدراسية:</div>
          <div class="card-value-box box-blue">${getYearName(record.year)}</div>
        </div>
        <div class="card-row">
          <div class="card-label">عدد الفرص التي دخل بها الطالب الامتحان:</div>
          <div class="card-value-box box-blue">${record.chances}</div>
        </div>
        <div class="card-row">
          <div class="card-label">صدر بحقه قرار فصل (رقم 26 سنة 2025):</div>
          <div class="card-value-box box-orange ${issuedClass}">${issuedVal}</div>
        </div>
        <div class="card-row">
          <div class="card-label">لم يصدر بحقه قرار فصل بعد:</div>
          <div class="card-value-box box-orange ${notIssuedClass}">${notIssuedVal}</div>
        </div>
      </div>
    </div>
  `;
}

function render(){
  const q = $searchInput.value;

  if(!q.trim()){
    $resultsContainer.innerHTML = `
      <div class="empty-state">
        <span class="big-icon">🔎</span>
        <span class="title">ابدأ الاستعلام</span>
        <p>يرجى إدخال الرقم الدراسي أو جزء من اسم الطالب للبدء في الاستعلام.</p>
      </div>`;
    return;
  }

  const found = searchStudents(q);
  if(found.length === 0){
    $resultsContainer.innerHTML = `
      <div class="empty-state">
        <span class="big-icon">📭</span>
        <span class="title">لا توجد نتائج مطابقة</span>
        <p>لم يتم العثور على نتائج لبحثك «<b>${q}</b>». يرجى التأكد من الرقم الدراسي أو الاسم.</p>
      </div>`;
    return;
  }

  let html = '';
  found.sort((a,b) => a.id.localeCompare(b.id, 'en', { numeric: true })).forEach(st => {
    st.records.forEach(rec => {
      html += renderCard(st, rec, false);
    });
  });
  $resultsContainer.innerHTML = html;
}

/* =========================================================
   5) الطباعة — فقط بطاقة الطالب المستعلم عنه
   ========================================================= */
function printStudentCard(btnEl){
  const card = btnEl.closest('.student-card');
  if(!card) return;

  // تفريغ حاوية الطباعة ثم نسخ البطاقة إليها
  $printArea.innerHTML = '';
  const clone = card.cloneNode(true);

  // إزالة زر الطباعة من النسخة
  const btn = clone.querySelector('.print-btn');
  if(btn) btn.remove();

  // إضافة تاريخ الطباعة إلى الترويسة
  const stamp = clone.querySelector('.print-header .stamp');
  if(stamp){
    const today = new Date().toLocaleDateString('ar-LY', {
      year: 'numeric', month: 'long', day: 'numeric'
    });
    stamp.textContent = `قرار فصل رقم 26 لسنة 2025 — تاريخ الطباعة: ${today}`;
  }

  $printArea.appendChild(clone);

  // تنفيذ الطباعة
  setTimeout(() => {
    window.print();
    // تنظيف حاوية الطباعة بعد إغلاق نافذة الطباعة
    setTimeout(() => { $printArea.innerHTML = ''; }, 800);
  }, 80);
}

/* =========================================================
   6) الأحداث
   ========================================================= */
let timer = null;
$searchInput.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(render, 80);
});
$searchInput.addEventListener('keydown', e => {
  if(e.key === 'Enter'){ clearTimeout(timer); render(); }
});

/* تشغيل أولي */
render();
</script>
